name: Release

on:
  push:
    tags:
      - v*

jobs:
  push:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Check that the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/administrate/mcp/version -e 'puts Administrate::MCP::VERSION')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - uses: rubygems/release-gem@v1
