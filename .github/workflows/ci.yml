name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: administrate_mcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      ADMINISTRATE_MCP_DB_HOST: localhost
      ADMINISTRATE_MCP_DB_PORT: 5432
      ADMINISTRATE_MCP_DB_USER: postgres
      ADMINISTRATE_MCP_DB_PASSWORD: postgres
      ADMINISTRATE_MCP_DB_NAME: administrate_mcp_test

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rubocop
