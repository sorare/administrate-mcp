default:
  image: ruby:4.0
  tags:
    - spot
  before_script:
    - ruby -v
    - bundle install --jobs 4

variables:
  KUBERNETES_MEMORY_REQUEST: 2Gi
  KUBERNETES_MEMORY_LIMIT: 2Gi
  KUBERNETES_CPU_REQUEST: 1000m
  POSTGRES_HOST_AUTH_METHOD: trust
  ADMINISTRATE_MCP_DB_HOST: postgres
  ADMINISTRATE_MCP_DB_PORT: '5432'
  ADMINISTRATE_MCP_DB_USER: postgres
  ADMINISTRATE_MCP_DB_PASSWORD: ''
  ADMINISTRATE_MCP_DB_NAME: administrate_mcp_test

stages:
  - test

rspec:
  stage: test
  services:
    - name: postgres:17
      alias: postgres
  script:
    - bundle exec rspec

rubocop:
  stage: test
  # RuboCop with the rails and rspec extensions needs more headroom than the suite does.
  variables:
    KUBERNETES_MEMORY_REQUEST: 4Gi
    KUBERNETES_MEMORY_LIMIT: 4Gi
  script:
    - bundle exec rubocop
